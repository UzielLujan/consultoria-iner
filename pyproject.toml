[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "record-linkage"
version = "0.1.0"
description = "Pipeline de consultoría para ligado y consolidación de registros clínicos del INER"
requires-python = ">=3.11"

dependencies = [
    # --- Datos ---
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "rapidfuzz>=3.0",
    "openpyxl>=3.1",

    # --- Visualización ---
    "matplotlib>=3.7",
    "matplotlib-venn>=0.11",

    # --- Configuración ---
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",       # notebooks
    "ipykernel>=6.0",     # kernel de jupyter para el entorno
    "pytest>=7.0",        # unit tests
    "ruff>=0.1",          # linter y formatter moderno (reemplaza flake8 + black)
]

[tool.hatch.build.targets.wheel]
packages = ["src/record_linkage"]